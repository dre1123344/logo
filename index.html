:root{color-scheme:dark;--edge:#30394b;--text:#edf2ff}*{box-sizing:border-box}body{margin:0;font-family:Inter,'Segoe UI','Microsoft YaHei',sans-serif;color:var(--text);min-height:100vh;background:radial-gradient(ellipse at 10% 0%,#1e335a 0%,transparent 43%),radial-gradient(ellipse at 90% 30%,#34234e 0%,transparent 48%),linear-gradient(125deg,#090e19,#101827 55%,#090e18);background-attachment:fixed}body:before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(550px circle at var(--mx,50%) var(--my,35%),#6387ff18,transparent 75%)}header{max-width:1300px;margin:auto;padding:62px 24px 32px}h1{font-size:clamp(30px,4vw,50px);letter-spacing:-1.5px;margin:0 0 12px}.sub{color:#a9b6ce;line-height:1.7}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}button,select{background:#202a3c;border:1px solid #46536a;border-radius:10px;color:white;padding:11px 16px;cursor:pointer;font-size:14px}button:hover,select:hover{border-color:#90aaff;background:#2a3852}.grid{max-width:1300px;margin:0 auto;padding:8px 24px 70px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px}.card{background:linear-gradient(145deg,#19202dca,#111723e8);border:1px solid #30394b;border-radius:18px;padding:22px;transition:transform .25s,border-color .25s,box-shadow .25s;overflow:hidden}.card:hover{transform:translateY(-5px);border-color:#6b81a7;box-shadow:0 20px 55px #0007}.preview{height:210px;border-radius:12px;background:radial-gradient(circle at 50% 40%,#202a3a,#090e16 75%);display:grid;place-items:center;position:relative;overflow:hidden}.preview:after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,#ffffff0b 50%,transparent 65%);transform:translateX(-120%);transition:transform .7s;pointer-events:none}.card:hover .preview:after{transform:translateX(120%)}.preview svg{width:135px;height:135px;filter:drop-shadow(0 4px 15px #b3c5ff23);transition:transform .35s}.card:hover .preview svg{transform:scale(1.12 </style></head><body><header><div class="tag">STARSEEDS · BRAND EXPLORATIONS</div><h1>Dual S / SVG Logo Collection</h1><div class="sub">汇总三张参考图中的 9 款 Logo · 原生矢量 SVG · 支持彩色渐变、单独下载、查看代码、复制 SVG。<br>背景主题与 Logo 配色可独立切换，鼠标移动触发彩色光晕，悬停卡片可交互预览。</div><div class="toolbar"><button id="all">↓ 下载全部 SVG（逐个保存）</button><select id="color"><option value="aurora" selected>极光霓虹渐变</option><option value="sunset">落日珊瑚渐变</option><option value="ocean">海洋蓝紫渐变</option><option value="original">原始双色</option><option value="ice">冰蓝渐变</option><option value="violet">紫色渐变</option><option value="gold">香槟金渐变</option></select><select id="bgmode"><option value="aurora">背景 · 梦幻极光</option><option value="sunset">背景 · 日落星云</option><option value="ocean">背景 · 深海电光</option><option value="candy">背景 · 糖果云霞</option></select><button id="reset">重置配色</button></div></header><main class="grid" id="grid"></main><div class="foot">Reconstructed as editable vector artwork from the supplied visual references · 2026</div><dialog id="modal"><div class="dialogtop"><strong id="modalTitle">SVG Source</strong><button onclick="document.getElementById('modal').close()">关闭 ×</button></div><pre id="source"></pre><button id="copyCode">复制代码</button></dialog><div id="toast"></div><script>
const items=[
['六边形矩阵双 S','Hexagon Framed Dual S','外框为高科技分布式六边形晶格，内部巧妙嵌入两个折线几何构成的 S 符号。','<polygon points="70,24 106,45 106,95 70,116 34,95 34,45" fill="none" stroke="#747a87" stroke-width="2.2"/><path d="M85 47 H56 L79 66 55 88 H85 M85 47 L60 67 85 88" fill="none" stroke="url(#metal)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>'],
['同心星轨双 S','Concentric Orbit Dual S','以精密的天文星轨圆环为几何基底，中心穿插两个对称咬合的几何 S 曲线。','<circle cx="70" cy="70" r="43" stroke="#69707c" stroke-width="1.4" fill="none"/><circle cx="70" cy="70" r="34" stroke="#5d6676" stroke-width="1" stroke-dasharray="3 5" fill="none"/><circle cx="70" cy="70" r="25" stroke="#454e5c" stroke-width=".8" fill="none"/><path d="M59 52 C45 51 47 69 65 70 L77 71 C96 74 94 92 81 94 M81 48 C95 51 92 68 76 70 L64 71 C45 75 48 92 60 94" stroke="url(#metal)" stroke-width="5" stroke-linecap="round" fill="none"/>'],
['菱形晶格双 S','Diamond Matrix Dual S','科技感十足的菱形几何框架内，内置斜切锐利化处理的双 S 结构。','<path d="M70 22 L112 70 70 118 28 70 Z" fill="none" stroke="#7c828e" stroke-width="2"/><path d="M83 48 H55 L78 67 55 89 H84 M84 48 L60 68 84 89" stroke="url(#metal)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" fill="none"/>'],
['三角晶格双  S','Triangle Lattice Dual S','以稳定且向上聚合的等边三角形几何框架为基础，内部交错排列两个规整的几何折线。','<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="currentColor"><rect x="18" y="18" width="8" height="8" rx="2" opacity="0.3"/><rect x="74" y="18" width="8" height="8" rx="2" opacity="0.3"/><rect x="18" y="74" width="8" height="8" rx="2" opacity="0.3"/><rect x="74" y="74" width="8" height="8" rx="2" opacity="0.3"/><path d="M 35 28 L 65 28 L 35 50 L 65 72 L 35 72" fill="none" stroke="url(#metal)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M 45 28 L 65 28 L 45 50 L 65 72" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/></g></svg>'],
['四角定位阵列双 S','Grid Framed Dual S','带有数字硬件感与精确定位四角的几何边框，内部包裹高辨识度的现代科技双 S 结构。','<g fill="#697180"><rect x="32" y="31" width="9" height="9" rx="1"/><rect x="99" y="31" width="9" height="9" rx="1"/><rect x="32" y="100" width="9" height="9" rx="1"/><rect x="99" y="100" width="9" height="9" rx="1"/></g><path d="M88 45 H51 L83 69 51 94 H88 M88 45 L58 69 88 94" stroke="url(#metal)" stroke-width="5.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'],
['圆形传送门双 S','Portal Geometric SS','以虚线科技圆环（Portal 概念）作为几何容器，内嵌双 S 互相咬合。','<circle cx="70" cy="70" r="45" fill="none" stroke="#818897" stroke-width="2.5" stroke-dasharray="5 5"/><path d="M55 51 C39 52 45 70 65 70 H75 C95 70 100 89 84 92 M85 49 C101 53 96 70 75 70 H65 C44 71 42 90 56 93" stroke="url(#metal)" stroke-width="5" fill="none" stroke-linecap="round"/>'],
['块面几何双 S','Solid Block SS','极简几何区域构成的两个实体 S 字母组合，棱角分明，强调科技 SaaS 平台的大气与稳重。','<path d="M43 34 H65 V57 L55 63 65 70 V103 H43 V77 L56 70 43 63 Z" fill="url(#bright)"/><path d="M77 34 H99 V63 L86 70 99 77 V103 H77 V80 L89 73 77 66 Z" fill="url(#muted)"/>'],
['咬合无限双 S','Interlocking Dual S','将两个 S 字母完美咬合串联成链状，象征无缝连接的 AI 算力与服务网络。','<path d="M60 33 C44 33 44 53 59 59 C71 65 91 63 94 79 C97 91 88 100 80 100" stroke="url(#bright)" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M80 33 C97 34 98 53 82 59 C70 65 49 64 47 79 C45 91 52 99 60 100" stroke="url(#muted)" stroke-width="6" fill="none" stroke-linecap="round"/>'],
['点阵星尘双 S','Dot Matrix Dual S','双轨点阵构成的数字星尘 S 矩阵，呼应数字艺术与高科技交互感。',(()=>{let a='';let pts=[[65,35,3.4],[53,40,3.3],[44,49,3.2],[49,59,3.1],[61,65,3.3],[76,70,3.1],[87,80,3.2],[81,91,3.2],[68,99,3.2],[55,97,2.8],[46,90,2.6],[77,36,2.5],[87,42,2.5],[74,48,2.6],[64,54,2.7],[58,79,2.9],[73,85,2.8],[89,63,2.8]];pts.forEach(([x,y,r],i)=>a+=`<circle cx="${x}" cy="${y}" r="${r}" fill="${i%4===0?'url(#muted)':'url(#bright)'}"/>`);return a})()]
];
let palette='aurora';const colors={aurora:['#fff5fc','#ff68bc','#7d6bff','#2de2d0'],sunset:['#fff5c9','#ffab58','#fa548d','#784dff'],ocean:['#e8ffff','#50e4ef','#398aff','#6b49db'],original:['#ffffff','#dce3ef','#959ca9','#666c77'],ice:['#efffff','#7fe1ff','#4787df','#315bb3'],violet:['#fff1ff','#d0a3ff','#9873df','#5d4b9f'],gold:['#fff8df','#f1c97d','#bb9a64','#77644f']};
function svg(i){let c=colors[palette];return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" role="img" aria-label="${items[i][0]}"><defs><linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="${c[0]}"/><stop offset=".55" stop-color="${c[1]}"/><stop offset="1" stop-color="${c[2]}"/></linearGradient><linearGradient id="bright" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="${c[0]}"/><stop offset="1" stop-color="${c[1]}"/></linearGradient><linearGradient id="muted" x1="0" y1="0" x2="1" y2="1"><stop stop-color="${c[2]}"/><stop offset="1" stop-color="${c[3]}"/></linearGradient></defs>${items[i][3]}</svg>`}
function download(i){let blob=new Blob([svg(i)],{type:'image/svg+xml;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`${String(i+1).padStart(2,'0')}_${items[i][1].replaceAll(' ','_')}.svg`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function toast(t){let el=document.getElementById('toast');el.textContent=t;el.style.opacity=1;clearTimeout(window.tt);window.tt=setTimeout(()=>el.style.opacity=0,2200)}
async function copy(t){try{await navigator.clipboard.writeText(t);toast('SVG 代码已复制')}catch{let ta=document.createElement('textarea');ta.value=t;document.body.append(ta);ta.select();document.execCommand('copy');ta.remove();toast('已复制')}}
function render(){document.getElementById('grid').innerHTML=items.map((it,i)=>`<article class="card"><div class="preview">${svg(i)}</div><div class="tag">DESIGN ${String(i+1).padStart(2,'0')} / VECTOR</div><h2>${String(i+1).padStart(2,'0')}. ${it[0]} <span style="color:#a9b9d6">(${it[1]})</span></h2><div class="desc">${it[2]}</div><div class="actions"><button data-action="view" data-i="${i}">查看 SVG</button><button data-action="copy" data-i="${i}">复制 SVG</button><button data-action="download" data-i="${i}">↓ 下载</button></div></article>`).join('')}
document.body.dataset.theme='aurora';document.getElementById('bgmode').onchange=e=>document.body.dataset.theme=e.target.value;render();document.getElementById('grid').addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let i=+b.dataset.i;if(b.dataset.action==='download')download(i);if(b.dataset.action==='copy')copy(svg(i));if(b.dataset.action==='view'){document.getElementById('modalTitle').textContent=items[i][0]+' · SVG 源码';document.getElementById('source').textContent=svg(i);document.getElementById('copyCode').onclick=()=>copy(svg(i));document.getElementById('modal').showModal()}});document.getElementById('color').onchange=e=>{palette=e.target.value;render()};document.getElementById('reset').onclick=()=>{palette='aurora';document.getElementById('color').value='aurora';render()};document.getElementById('all').onclick=()=>{items.forEach((_,i)=>setTimeout(()=>download(i),i*250));toast('正在下载 9 个 SVG；浏览器可能需要允许多个下载')};window.addEventListener('pointermove',e=>{document.body.style.setProperty('--mx',e.clientX+'px');document.body.style.setProperty('--my',e.clientY+'px')});
</script></body></html>
